
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Activity 2</title>

  <style>
    body {
      font: 1.2em / 1.5 sans-serif;
    }

    ul {
      max-width: 750px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background-color: #4d7298;
      border: 2px solid #77a6b6;
      border-radius: 0.5em;
      color: white;
      padding: 0.5em;
    }

    /* Flexbox solution */
    ul {
      display: flex;
    }

    li {
      flex: 1;
    }
  </style>
</head>

<body>

  <ul>
    <li>I am small</li>

    <li>
      I have more content than the very small item.
    </li>

    <li>
      I have lots of content. So much content that I don't
      know where it is all going to go. I'm glad that CSS
      is pretty good at dealing with situations where we
      end up with more words than expected!
    </li>
  </ul>

</body>
</html>
